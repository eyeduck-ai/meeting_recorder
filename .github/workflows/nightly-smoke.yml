name: Nightly Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build isolated recording image
        run: docker build -f docker/Dockerfile --build-arg BUILD_TIMESTAMP=${{ github.sha }} --build-arg APP_UID=$(id -u) --build-arg APP_GID=$(id -g) -t meeting-recorder:smoke .

      - name: Run recording stack without root or privileges
        run: |
          mkdir -p smoke-artifacts
          docker run --name meeting-recorder-smoke --init --network none \
            --cap-drop ALL --security-opt no-new-privileges --shm-size 2g \
            -v "$PWD/smoke-artifacts:/proof" meeting-recorder:smoke \
            python -m scripts.smoke_recording --duration-sec 8 \
            --output-dir /proof/recordings --diagnostics-dir /proof/diagnostics

      - name: Capture container logs
        if: always()
        run: docker logs meeting-recorder-smoke > smoke-artifacts/container.log 2>&1 || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-artifacts
          if-no-files-found: warn
          path: |
            smoke-artifacts

      - name: Tear down
        if: always()
        run: docker rm -f meeting-recorder-smoke || true
