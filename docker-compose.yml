# Docker Compose - Base Configuration
# 共用設定，開發與生產皆使用此檔案

name: ${COMPOSE_PROJECT_NAME:-meeting-recorder-dev}

services:
  app:
    image: ${MEETING_RECORDER_IMAGE:-ghcr.io/eyeduck-ai/meeting_recorder:latest}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - ./recordings:/app/recordings
      - ./diagnostics:/app/diagnostics
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: '2gb'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # DNS configuration for resilience against transient DNS failures
    dns:
      - 8.8.8.8 # Google Primary DNS
      - 8.8.4.4 # Google Secondary DNS
      - 1.1.1.1 # Cloudflare DNS
